{
  "kind": "stage1_qwen3vl",
  "name": "domain_defaults",
  "model": "Qwen/Qwen3-VL-4B-Instruct",
  "entrypoint": "qwenvl/train/train_qwen.py",
  "data_manifest": "examples/manifests/embodied_vqa_manifest.example.yaml",
  "output_dir": "${RETHINK_OUTPUT_ROOT}/stage1/domain_defaults",
  "training": {
    "update": "lora",
    "lora_rank": 16,
    "lora_alpha": 32,
    "unfreeze_vision_encoder_last_fraction": 0.25
  },
  "args": {
    "num_train_epochs": 1,
    "learning_rate": "5e-5",
    "per_device_train_batch_size": 1,
    "gradient_accumulation_steps": 128,
    "warmup_ratio": 0.03,
    "lr_scheduler_type": "cosine",
    "bf16": true
  },
  "domains": [
    "spatial",
    "grounding",
    "plan_reasoning",
    "camera_prediction",
    "egocentric_understanding",
    "temporal_understanding",
    "action_ntp"
  ]
}

