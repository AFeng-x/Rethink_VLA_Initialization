{
  "kind": "stage1_qwen3vl",
  "name": "qwen3vl_4b_grounding_ego_lora",
  "model": "Qwen/Qwen3-VL-4B-Instruct",
  "entrypoint": "qwenvl/train/train_qwen.py",
  "data_manifest": "examples/manifests/embodied_vqa_manifest.example.yaml",
  "output_dir": "${RETHINK_OUTPUT_ROOT}/stage1/qwen3vl_4b_grounding_ego_lora",
  "training": {
    "update": "lora",
    "lora_rank": 16,
    "lora_alpha": 32,
    "target_domains": ["grounding", "egocentric_understanding"],
    "target_samples": 800000,
    "sampling": "even_by_domain",
    "unfreeze_vision_encoder_last_fraction": 0.25
  },
  "args": {
    "num_train_epochs": 1,
    "learning_rate": "5e-5",
    "per_device_train_batch_size": 1,
    "gradient_accumulation_steps": 128,
    "warmup_ratio": 0.03,
    "lr_scheduler_type": "cosine",
    "weight_decay": 0,
    "bf16": true
  }
}

